<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เขมรคลับ - Gang Tree Hierarchy</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080c;
            --card-bg: #13131a;
            --accent-gold: #ffcc00;
            --accent-blue: #00f0ff;
            --accent-green: #00ff66;
            --accent-red: #ff1e56;
            --accent-purple: #bd00ff;
            --accent-pink: #ff66b2;
            --text-color: #ffffff;
            --text-muted: #8b8b9e;
            --line-color: rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            overflow-x: auto;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 30, 86, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 30, 86, 0.3);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* --- โครงสร้างต้นไม้แบบลำดับชั้น (Hierarchy Tree) --- */
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .tier {
            display: flex;
            justify-content: center;
            gap: 40px;
            position: relative;
            margin-top: 50px;
            width: 100%;
            flex-wrap: wrap;
        }

        .tier::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background-color: var(--line-color);
            box-shadow: 0 0 8px var(--line-color);
        }

        .tier.root-tier::before {
            display: none;
        }

        .tier .node-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 280px;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
        }

        .card.boss::before { background-color: var(--accent-gold); box-shadow: 0 0 12px var(--accent-gold); }
        .card.limb::before { background-color: var(--accent-blue); box-shadow: 0 0 12px var(--accent-blue); }
        .card.egg::before { background-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .card.bodyhair::before { background-color: var(--accent-red); box-shadow: 0 0 12px var(--accent-red); }
        .card.gig::before { background-color: var(--accent-purple); box-shadow: 0 0 12px var(--accent-purple); }
        .card.concubine::before { background-color: var(--accent-pink); box-shadow: 0 0 12px var(--accent-pink); }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* เอฟเฟกต์เวลาเอาเมาส์ชี้รูปหัวหน้าเพื่อบอกว่ากดได้ */
        .bio-link .avatar:hover {
            transform: scale(1.1);
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .name {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discord {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .badge.boss { background-color: rgba(255, 204, 0, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 204, 0, 0.4); }
        .badge.limb { background-color: rgba(0, 240, 255, 0.15); color: var(--accent-blue); border: 1px solid rgba(0, 240, 255, 0.4); }
        .badge.egg { background-color: rgba(0, 255, 102, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 255, 102, 0.4); }
        .badge.bodyhair { background-color: rgba(255, 30, 86, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 30, 86, 0.4); }
        .badge.gig { background-color: rgba(189, 0, 255, 0.15); color: var(--accent-purple); border: 1px solid rgba(189, 0, 255, 0.4); }
        .badge.concubine { background-color: rgba(255, 102, 178, 0.15); color: var(--accent-pink); border: 1px solid rgba(255, 102, 178, 0.4); }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
